<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quadrix</title>
    <link rel="stylesheet" href="/src/page.css" />
  </head>
  <body>
    <main class="app">
      <section class="side">
        <h1>Quadrix</h1>
        <div class="card player">
          <label class="name">
            <span class="label">Name</span>
            <input
              id="name"
              type="text"
              maxlength="64"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            />
          </label>
          <p id="best-row" class="best"><span class="label">Best</span> <span id="best">0</span></p>
        </div>
        <div class="controls">
          <button id="pause" class="primary" type="button" tabindex="-1" data-action="pause">
            Pause
          </button>
          <button id="open-settings" type="button" tabindex="-1">Settings</button>
          <button id="mute" type="button" tabindex="-1" aria-pressed="false">Mute</button>
          <button
            id="guide-toggle"
            type="button"
            tabindex="-1"
            aria-controls="guide"
            aria-expanded="false"
            hidden
          >
            Controls
          </button>
        </div>
        <div class="hud card">
          <p id="rung-row" class="stat" hidden>
            <span class="label">Rung</span> <span id="rung" class="value">1</span>
          </p>
          <p id="goal-row" class="stat" hidden>
            <span class="label">Goal</span> <span id="goal" class="value">0 / 0</span>
          </p>
          <p class="stat score">
            <span class="label">Score</span> <span id="score" class="value">0</span>
          </p>
          <p class="stat">
            <span class="label">Lines</span> <span id="lines" class="value">0</span>
          </p>
          <p class="stat">
            <span class="label">Level</span> <span id="level" class="value">1</span>
          </p>
          <div class="next">
            <span class="label">Next</span>
            <canvas id="next" role="img" aria-label="Next piece"></canvas>
          </div>
        </div>
        <p id="status" aria-live="polite"></p>
      </section>
      <div class="well">
        <canvas id="board" role="img" aria-label="Game board"></canvas>
        <p id="award" class="award" aria-live="polite"></p>
        <div id="overlay" class="overlay" hidden>
          <p id="goal-text" class="goal-text"></p>
          <p id="countdown" class="countdown"></p>
          <div id="menu" class="pause-menu" role="group" aria-label="Main menu" hidden>
            <p class="pause-title">Play</p>
            <button id="play-ladder" class="primary" type="button">Ladder</button>
            <button type="button" data-mode="classic">Classic</button>
            <button type="button" data-mode="override">Override</button>
            <button id="open-cloud" type="button" hidden>Cloud save</button>
          </div>
          <div
            id="cloud"
            class="pause-menu cloud"
            role="group"
            aria-labelledby="cloud-title"
            hidden
          >
            <p id="cloud-title" class="pause-title">Cloud save</p>
            <p id="cloud-status" class="cloud-status" aria-live="polite"></p>
            <button id="cloud-on" type="button">Turn on cloud save</button>
            <button id="cloud-link" type="button">Link another device</button>
            <p id="link-code" class="link-code" aria-label="Link code"></p>
            <label class="link-entry">
              Link code from another device
              <input
                id="link-input"
                type="text"
                maxlength="16"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                placeholder="ABCD-EFGH"
              />
            </label>
            <button id="link-submit" type="button">Enter link code</button>
            <p id="cloud-note" class="cloud-note" aria-live="polite"></p>
            <button id="cloud-off" type="button">Turn off cloud save on this device</button>
            <button id="cloud-back" type="button">Back</button>
          </div>
          <div
            id="settings"
            class="pause-menu settings"
            role="group"
            aria-labelledby="settings-title"
            hidden
          >
            <div class="settings-top">
              <button id="settings-back" type="button">Back</button>
              <p id="settings-title" class="pause-title">Settings</p>
              <button id="settings-reset" type="button" aria-label="Reset to defaults">
                Reset
              </button>
            </div>
            <div class="tabs" role="tablist" aria-label="Settings sections">
              <button
                id="tab-general"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="settings-general"
              >
                General
              </button>
              <button
                id="tab-styles"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="settings-styles"
                tabindex="-1"
              >
                Styles
              </button>
            </div>
            <div class="tab-panels">
              <div
                id="settings-general"
                class="tab-panel"
                role="tabpanel"
                aria-labelledby="tab-general"
              >
                <div class="setting-pair">
                  <label class="setting check">
                    <input id="set-ghost" type="checkbox" />
                    Ghost piece
                  </label>
                  <label class="setting check">
                    Effects
                    <select id="set-effects">
                      <option value="full">Full</option>
                      <option value="reduced">Reduced</option>
                      <option value="off">Off</option>
                    </select>
                  </label>
                </div>
                <label class="setting slider">
                  <span>Ghost opacity <output id="set-ghost-opacity-value"></output></span>
                  <input id="set-ghost-opacity" type="range" min="10" max="60" step="10" />
                </label>
                <label class="setting slider">
                  <span>Auto-repeat delay <output id="set-delay-value"></output></span>
                  <input id="set-delay" type="range" min="50" max="300" step="1" />
                </label>
                <label class="setting slider">
                  <span>Repeat interval <output id="set-interval-value"></output></span>
                  <input id="set-interval" type="range" min="0" max="100" step="1" />
                </label>
                <label class="setting slider">
                  <span>Effects volume <output id="set-sfx-value"></output></span>
                  <input id="set-sfx" type="range" min="0" max="100" step="1" />
                </label>
                <label class="setting slider">
                  <span>Music volume <output id="set-music-value"></output></span>
                  <input id="set-music" type="range" min="0" max="100" step="1" />
                </label>
                <p class="settings-head">Keys</p>
                <div id="set-keys" class="set-keys"></div>
              </div>
              <div
                id="settings-styles"
                class="tab-panel"
                role="tabpanel"
                aria-labelledby="tab-styles"
                hidden
              >
                <fieldset class="styles">
                  <legend class="settings-head">Pieces</legend>
                  <div id="set-styles" class="style-options"></div>
                </fieldset>
              </div>
            </div>
            <p id="settings-note" class="settings-note" aria-live="polite"></p>
          </div>
          <div id="ladder" class="pause-menu ladder" role="group" aria-label="Ladder" hidden>
            <div class="ladder-head">
              <button id="ladder-back" type="button">Back</button>
              <p class="pause-title">Ladder</p>
              <button id="ladder-current" type="button">Current</button>
            </div>
            <ol id="rung-list" class="rung-list" aria-label="Rungs"></ol>
          </div>
          <div id="result" class="pause-menu" role="group" aria-labelledby="result-title" hidden>
            <p id="result-title" class="pause-title"></p>
            <p id="result-stars" class="result-stars"></p>
            <p id="result-detail" class="result-detail"></p>
            <button id="result-next" class="primary" type="button">Next</button>
            <button id="result-retry" type="button">Retry</button>
            <button id="result-back" type="button">Ladder</button>
          </div>
          <div id="pause-menu" class="pause-menu" role="group" aria-label="Paused">
            <p class="pause-title">Paused</p>
            <button id="resume" class="primary" type="button">Resume</button>
            <button id="restart" type="button">Restart</button>
            <button id="pause-settings" type="button">Settings</button>
            <button id="quit" class="quiet-danger" type="button">Quit</button>
          </div>
          <div
            id="resume-prompt"
            class="pause-menu"
            role="group"
            aria-label="Unfinished game"
            hidden
          >
            <p class="pause-title">Resume game?</p>
            <button id="resume-saved" class="primary" type="button">Resume</button>
            <button id="discard-saved" type="button">Discard</button>
          </div>
        </div>
      </div>
      <aside id="guide" class="guide" aria-labelledby="guide-title" hidden>
        <div class="guide-head">
          <p id="guide-title" class="guide-title">Controls</p>
          <button id="guide-close" type="button" tabindex="-1" aria-label="Close controls">
            ×
          </button>
        </div>
        <dl id="guide-keys" class="guide-keys"></dl>
      </aside>
      <div class="pad" role="group" aria-label="Touch controls">
        <button type="button" tabindex="-1" data-action="left" aria-label="Move left">←</button>
        <button type="button" tabindex="-1" data-action="right" aria-label="Move right">→</button>
        <button type="button" tabindex="-1" data-action="softDrop" aria-label="Soft drop">↓</button>
        <button type="button" tabindex="-1" data-action="hardDrop" aria-label="Hard drop">⤓</button>
        <button type="button" tabindex="-1" data-action="rotate" aria-label="Rotate">↻</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
