<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quadrix</title>
    <link rel="stylesheet" href="/src/page.css" />
  </head>
  <body>
    <main class="app">
      <section class="side">
        <h1>Quadrix</h1>
        <label class="name">
          Name
          <input
            id="name"
            type="text"
            maxlength="64"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
        </label>
        <p id="best-row" class="best">Best <span id="best">0</span></p>
        <div class="controls">
          <button id="pause" type="button" tabindex="-1" data-action="pause">Pause</button>
        </div>
        <div class="hud">
          <p id="rung-row" hidden>Rung <span id="rung">1</span></p>
          <p id="goal-row" hidden>Goal <span id="goal">0 / 0</span></p>
          <p>Score <span id="score">0</span></p>
          <p>Lines <span id="lines">0</span></p>
          <p>Level <span id="level">1</span></p>
          <div class="next">
            Next
            <canvas id="next" role="img" aria-label="Next piece"></canvas>
          </div>
        </div>
        <p id="status" aria-live="polite"></p>
        <p class="help">← → move · ↑ rotate · ↓ soft drop · Space hard drop · P / Esc pause</p>
      </section>
      <div class="well">
        <canvas id="board" role="img" aria-label="Game board"></canvas>
        <div id="overlay" class="overlay" hidden>
          <p id="goal-text" class="goal-text"></p>
          <p id="countdown" class="countdown"></p>
          <div id="menu" class="pause-menu" role="group" aria-label="Main menu" hidden>
            <p class="pause-title">Play</p>
            <button id="play-ladder" type="button">Ladder</button>
            <button type="button" data-mode="classic">Classic</button>
            <button type="button" data-mode="override">Override</button>
            <button id="open-cloud" type="button" hidden>Cloud save</button>
          </div>
          <div
            id="cloud"
            class="pause-menu cloud"
            role="group"
            aria-labelledby="cloud-title"
            hidden
          >
            <p id="cloud-title" class="pause-title">Cloud save</p>
            <p id="cloud-status" class="cloud-status" aria-live="polite"></p>
            <button id="cloud-on" type="button">Turn on cloud save</button>
            <button id="cloud-link" type="button">Link another device</button>
            <p id="link-code" class="link-code" aria-label="Link code"></p>
            <label class="link-entry">
              Link code from another device
              <input
                id="link-input"
                type="text"
                maxlength="16"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                placeholder="ABCD-EFGH"
              />
            </label>
            <button id="link-submit" type="button">Enter link code</button>
            <p id="cloud-note" class="cloud-note" aria-live="polite"></p>
            <button id="cloud-off" type="button">Turn off cloud save on this device</button>
            <button id="cloud-back" type="button">Back</button>
          </div>
          <div id="ladder" class="pause-menu ladder" role="group" aria-label="Ladder" hidden>
            <div class="ladder-head">
              <button id="ladder-back" type="button">Back</button>
              <p class="pause-title">Ladder</p>
              <button id="ladder-current" type="button">Current</button>
            </div>
            <ol id="rung-list" class="rung-list" aria-label="Rungs"></ol>
          </div>
          <div id="result" class="pause-menu" role="group" aria-labelledby="result-title" hidden>
            <p id="result-title" class="pause-title"></p>
            <p id="result-stars" class="result-stars"></p>
            <p id="result-detail" class="result-detail"></p>
            <button id="result-next" type="button">Next</button>
            <button id="result-retry" type="button">Retry</button>
            <button id="result-back" type="button">Ladder</button>
          </div>
          <div id="pause-menu" class="pause-menu" role="group" aria-label="Paused">
            <p class="pause-title">Paused</p>
            <button id="resume" type="button">Resume</button>
            <button id="restart" type="button">Restart</button>
            <button id="quit" type="button">Quit</button>
          </div>
          <div
            id="resume-prompt"
            class="pause-menu"
            role="group"
            aria-label="Unfinished game"
            hidden
          >
            <p class="pause-title">Resume game?</p>
            <button id="resume-saved" type="button">Resume</button>
            <button id="discard-saved" type="button">Discard</button>
          </div>
        </div>
      </div>
      <div class="pad" role="group" aria-label="Touch controls">
        <button type="button" tabindex="-1" data-action="left" aria-label="Move left">←</button>
        <button type="button" tabindex="-1" data-action="right" aria-label="Move right">→</button>
        <button type="button" tabindex="-1" data-action="softDrop" aria-label="Soft drop">↓</button>
        <button type="button" tabindex="-1" data-action="hardDrop" aria-label="Hard drop">⤓</button>
        <button type="button" tabindex="-1" data-action="rotate" aria-label="Rotate">↻</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
